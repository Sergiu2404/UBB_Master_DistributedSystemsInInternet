services:
  postgres:
    image: postgres:17-alpine
    container_name: compute-scheduler-postgres
    environment:
      POSTGRES_DB: compute_resources
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d compute_resources" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: