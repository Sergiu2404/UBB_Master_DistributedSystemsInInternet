<article class="flex items-center gap-4 rounded-xl border border-slate-700 bg-slate-800 p-4">
  <app-signal-strength-icon [signalLevel]="network().signalLevel" />

  <div class="min-w-0 flex-1">
    <div class="flex items-baseline justify-between gap-2">
      <h3 class="truncate text-lg font-semibold text-slate-100">{{ displayedSsid() }}</h3>
      <span class="font-mono text-lg font-semibold" [class]="rssiColorClass()">
        {{ network().rssi }} dBm
      </span>
    </div>

    <p class="truncate font-mono text-sm text-slate-400">
      {{ network().bssid }} · {{ displayedManufacturer() }}
    </p>

    <dl class="mt-2 grid grid-cols-2 gap-x-4 gap-y-1 text-sm sm:grid-cols-5">
      <div>
        <dt class="text-slate-500">Channel</dt>
        <dd class="text-slate-200">{{ network().channel }}</dd>
      </div>
      <div>
        <dt class="text-slate-500">Frequency</dt>
        <dd class="text-slate-200">{{ frequencyMegahertz() }} MHz</dd>
      </div>
      <div>
        <dt class="text-slate-500">Band</dt>
        <dd class="text-slate-200">{{ bandLabel() }}</dd>
      </div>
      <div>
        <dt class="text-slate-500">Standard</dt>
        <dd class="text-slate-200">{{ network().phyType }}</dd>
      </div>
      <div>
        <dt class="text-slate-500">Link quality</dt>
        <dd class="text-slate-200">{{ network().linkQuality }}%</dd>
      </div>
    </dl>
  </div>
</article>
